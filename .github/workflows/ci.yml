name: NoticeLedger checks
on: [push, pull_request]
jobs:
  pipeline-and-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pip install -r requirements.txt -r tests/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check web/app.js
      - run: python -m playwright install --with-deps chromium
      - run: npm install --prefix .test-tools axe-core@4.14.0
      - run: python tests/run_workflows.py
        env:
          AXE_SCRIPT: .test-tools/node_modules/axe-core/axe.min.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noticeledger-browser-results
          path: docs/screenshots/
